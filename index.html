<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes bus">
<meta name="theme-color" content="#07060d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="icon.png">
<title>Mes bus TCL</title>
<style>
  :root {
    --bg: #07060d; --card: rgba(18, 14, 34, .85); --card2: #150f28; --line: rgba(160, 120, 255, .18);
    --text: #ece6ff; --muted: #8a80ad; --accent: #ff2d6f; --ok: #39ff9f; --warn: #ffb020;
    --aller: #22e4ff; --retour: #ff3df2; --autre: #b48cff;
    --amber: #ffb547;
    --top: env(safe-area-inset-top, 0px);
    --digits: "VT323", ui-monospace, monospace;
    --display: "Orbitron", -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 "Share Tech Mono", ui-monospace, monospace; }
  body { padding: 0 16px calc(env(safe-area-inset-bottom) + 28px); min-height: 100vh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(140, 60, 255, .28), transparent 60%),
      radial-gradient(80% 50% at 100% 100%, rgba(255, 45, 160, .14), transparent 60%),
      var(--bg);
    background-attachment: fixed; }
  /* Grille rétro en perspective en bas d'écran + lignes de balayage façon vieil écran */
  body::before { content: ""; position: fixed; left: -20%; right: -20%; bottom: 0; height: 40vh; pointer-events: none; z-index: -1;
    background:
      linear-gradient(rgba(255, 61, 242, .25) 1px, transparent 1px) 0 0 / 100% 26px,
      linear-gradient(90deg, rgba(34, 228, 255, .2) 1px, transparent 1px) 0 0 / 38px 100%;
    transform: perspective(260px) rotateX(55deg); transform-origin: bottom;
    -webkit-mask-image: linear-gradient(transparent, #000 75%); mask-image: linear-gradient(transparent, #000 75%); }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(rgba(0, 0, 0, .16) 0 1px, transparent 1px 3px); }

  /* Barre du haut opaque : elle recouvre la zone du notch pour que rien ne passe dessous en flou */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg);
    margin: 0 -16px; padding: calc(var(--top) + 18px) 16px 14px;
    box-shadow: 0 10px 20px -10px var(--bg); }
  .topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  h1 { font-family: var(--display); font-weight: 900; font-size: 18px; margin: 0; letter-spacing: .16em;
    text-transform: uppercase; color: #fff;
    text-shadow: 0 0 6px var(--accent), 0 0 16px var(--accent), 0 0 30px rgba(255, 45, 111, .6); }
  .clock { font-family: var(--digits); font-size: 52px; line-height: .85; color: var(--amber); letter-spacing: .03em;
    text-shadow: 0 0 6px rgba(255, 181, 71, .9), 0 0 22px rgba(255, 140, 30, .6); }
  .clock .colon { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 10px; }

  button { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: transparent; border: 2px solid var(--accent); color: #fff; font-family: var(--display);
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 13px;
    box-shadow: 0 0 10px rgba(255, 45, 111, .6), inset 0 0 10px rgba(255, 45, 111, .4); text-shadow: 0 0 6px var(--accent); }
  .round { width: 50px; height: 50px; border-radius: 50%; padding: 0; display: grid; place-items: center;
    background: rgba(20, 14, 40, .9); border: 2px solid rgba(34, 228, 255, .75); color: var(--aller);
    box-shadow: 0 0 10px rgba(34, 228, 255, .45), inset 0 0 10px rgba(34, 228, 255, .25); }
  .round:active { transform: scale(.94); }
  .round svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px currentColor); }

  /* Onglets Aller / Retour */
  .tabs { display: flex; gap: 10px; margin-top: 16px; }
  .tab { flex: 1; border-radius: 12px; padding: 12px 0; background: rgba(20, 14, 40, .7);
    border: 2px solid color-mix(in srgb, var(--c) 30%, transparent);
    font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .16em; text-transform: uppercase;
    color: color-mix(in srgb, var(--c) 45%, #666); }
  .tab.on { color: #fff; border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
    text-shadow: 0 0 6px var(--c), 0 0 16px var(--c);
    box-shadow: 0 0 14px color-mix(in srgb, var(--c) 70%, transparent), inset 0 0 14px color-mix(in srgb, var(--c) 35%, transparent); }
  .status { display: flex; align-items: center; gap: 8px; margin-top: 12px; text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 8px var(--ok);
    animation: pulse 2s ease-in-out infinite; }
  .dot.stale { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  @keyframes pulse { 50% { opacity: .35; } }

  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); margin: 6px 0 12px; }
  input:focus { outline: none; border-color: var(--aller); box-shadow: 0 0 10px rgba(34, 228, 255, .4); }

  /* Cartes d'étape */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  .leg { border: 1.5px solid color-mix(in srgb, var(--c) 65%, transparent);
    box-shadow: 0 0 16px color-mix(in srgb, var(--c) 28%, transparent), inset 0 0 24px color-mix(in srgb, var(--c) 8%, transparent); }
  .leg-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .step { width: 32px; height: 32px; border-radius: 8px; border: 2px solid var(--c); color: var(--c); font-family: var(--digits);
    font-size: 26px; display: grid; place-items: center; flex: none; text-shadow: 0 0 8px var(--c);
    box-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); }
  .leg-title { font-family: var(--display); font-weight: 700; font-size: 14px; line-height: 1.3; letter-spacing: .04em; color: #fff; }
  .leg-to { color: var(--c); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; text-shadow: 0 0 6px var(--c); }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .row:first-of-type { border-top: 0; }
  .badge { min-width: 50px; text-align: center; font-family: var(--display); font-weight: 900; font-size: 13px; padding: 6px;
    border-radius: 8px; border: 2px solid var(--accent); color: #fff; flex: none; background: rgba(255, 45, 111, .12);
    text-shadow: 0 0 6px var(--accent); box-shadow: 0 0 8px rgba(255, 45, 111, .5); }
  .dir { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.25; }
  .times { display: flex; gap: 12px; flex: none; }
  .t { text-align: center; min-width: 46px; }
  .t b { display: block; font-family: var(--digits); font-weight: 400; font-size: 36px; line-height: .9; }
  .t b small { font-size: 17px; }
  .t span { display: block; font-family: var(--digits); font-size: 18px; color: var(--muted); }
  .t.live b { color: var(--ok); text-shadow: 0 0 6px var(--ok), 0 0 16px rgba(57, 255, 159, .6); }
  .t.theo b { color: var(--amber); text-shadow: 0 0 6px rgba(255, 181, 71, .6); }
  .t:not(:first-child) b { font-size: 27px; }
  .err { color: var(--warn); font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
  .legend { margin-top: 6px; font-size: 12px; text-align: center; }
  .legend .g { color: var(--ok); text-shadow: 0 0 6px var(--ok); }
  .legend .a { color: var(--amber); text-shadow: 0 0 6px var(--amber); }

  /* Réglages */
  .card h2 { font-family: var(--display); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 8px;
    color: var(--aller); text-shadow: 0 0 8px rgba(34, 228, 255, .7); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .chip { font-size: 14px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; }
  .chip.on { border-color: var(--accent); box-shadow: 0 0 8px rgba(255, 45, 111, .6); text-shadow: 0 0 6px var(--accent); }
  .chip.sec.on { border-color: var(--c); box-shadow: 0 0 8px var(--c); text-shadow: 0 0 6px var(--c); }
  .result { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .result .sub { display: block; }
  .fav { padding: 12px 0; border-top: 1px solid var(--line); }
  .fav:first-child { border-top: 0; }
  .fav-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ===== Écran principal ===== -->
<section id="main">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>Mes bus</h1>
        <div class="clock" id="clock">--:--</div>
      </div>
      <div class="actions">
        <button class="round" id="settingsBtn" aria-label="Réglages">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="status sub"><span class="dot" id="dot"></span><span id="updated">Chargement…</span></div>
  </div>
  <div id="board"></div>
  <p class="sub legend"><span class="g">● temps réel</span> · <span class="a">● théorique</span> · auto toutes les 15 s</p>
</section>

<!-- ===== Réglages ===== -->
<section id="settings" class="hidden">
  <div class="topbar">
    <div class="topbar-row">
      <h1>Réglages</h1>
      <button class="primary" id="doneBtn">Terminé</button>
    </div>
  </div>

  <div class="card">
    <h2>Compte data.grandlyon.com</h2>
    <div class="sub">Mot de passe de la plateforme de données (API). Stocké uniquement sur cet appareil.</div>
    <input id="user" placeholder="Identifiant (e-mail)" autocomplete="username" autocapitalize="off">
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="testBtn">Tester la connexion</button>
    <span id="testResult" class="sub"></span>
  </div>

  <div class="card">
    <h2>Mes arrêts</h2>
    <div id="favList"></div>
  </div>

  <div class="card">
    <h2>Ajouter un arrêt</h2>
    <input id="search" placeholder="Nom de l'arrêt (ex. Bellecour)" autocomplete="off">
    <div id="results" class="sub">Tape au moins 3 lettres.</div>
  </div>
</section>

<script>
const API = "https://download.data.grandlyon.com/ws/rdata";
const REFRESH_MS = 15000;
const MAX_PASSAGES = 3;
const SECTIONS = [
  { id: "Aller", color: "var(--aller)" },
  { id: "Retour", color: "var(--retour)" },
  { id: "Autre", color: "var(--autre)" },
];
const sectionColor = id => (SECTIONS.find(s => s.id === id) || SECTIONS[2]).color;

// ---------- Stockage local ----------
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
let creds = load("tcl_creds", { user: "", pass: "" });
// favoris : [{ section, key, ids: [...quais], nom, lignes: [...toutes les lignes], choix: [...lignes affichées, vide = toutes] }]
// Trajets par défaut. Chaque arrêt ne garde que les quais du bon sens (ids), donc on ne voit pas la direction opposée.
const DEFAULT_FAVS = [
  { section: "Aller", key: "aller-1", nom: "Instit. Art Contemporain → Part-Dieu", ids: [47001], lignes: ["TB11", "C23"], choix: ["TB11", "C23"] },
  { section: "Aller", key: "aller-2", nom: "Part-Dieu Jules Favre → Echangeur du Pérollier", ids: [2206], lignes: ["C6"], choix: ["C6"] },
  { section: "Retour", key: "retour-1", nom: "Echangeur du Pérollier → Part-Dieu", ids: [47985], lignes: ["C6"], choix: ["C6"] },
  { section: "Retour", key: "retour-2", nom: "Part-Dieu Jules Favre → Instit. Art Contemporain", ids: [46191], lignes: ["TB11", "C23"], choix: ["TB11", "C23"] },
];
let favs = load("tcl_favs_v2", DEFAULT_FAVS);
favs.forEach(f => { f.section ||= "Autre"; });

// Onglet affiché : Aller le matin, Retour à partir de 13 h
let currentTab = new Date().getHours() < 13 ? "Aller" : "Retour";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- API ----------
async function fetchPassages(stopId) {
  const url = `${API}/tcl_sytral.tclpassagearret/all.json?maxfeatures=-1&field=id&value=${encodeURIComponent(stopId)}`;
  let res;
  try {
    res = await fetch(url, {
      headers: { Authorization: "Basic " + btoa(unescape(encodeURIComponent(`${creds.user}:${creds.pass}`))) },
    });
  } catch {
    // Le serveur renvoie ses 401 sans en-tête CORS : le navigateur ne voit qu'une erreur réseau
    throw new Error("Connexion impossible : identifiants incorrects, accès au jeu de données non validé, ou pas de réseau");
  }
  if (res.status === 401 || res.status === 403) throw new Error("Identifiants refusés ou accès au jeu de données non validé");
  if (!res.ok) throw new Error(`Erreur ${res.status}`);
  return (await res.json()).values || [];
}

let allStops = null;
async function getStops() {
  if (allStops) return allStops;
  const res = await fetch(`${API}/tcl_sytral.tclarret/all.json?maxfeatures=-1`);
  const json = await res.json();
  // Regroupe les quais portant le même nom dans la même commune
  const byKey = new Map();
  for (const s of json.values) {
    const key = `${s.nom}|${s.commune || ""}`;
    if (!byKey.has(key)) byKey.set(key, { key, nom: s.nom, commune: s.commune || "", ids: [], lignes: new Set() });
    const g = byKey.get(key);
    g.ids.push(s.id);
    (s.desserte || "").split(",").map(d => d.split(":")[0]).filter(Boolean).forEach(l => g.lignes.add(l));
  }
  allStops = [...byKey.values()].map(g => ({
    ...g, lignes: [...g.lignes].sort((a, b) => a.localeCompare(b, "fr", { numeric: true })),
  }));
  return allStops;
}

// ---------- Affichage des passages ----------
const toDate = ts => new Date(ts.replace(" ", "T"));
const minutesUntil = ts => Math.round((toDate(ts) - Date.now()) / 60000);

function fmtTime(p) {
  const m = minutesUntil(p.heurepassage);
  const big = m <= 0 ? "Proche" : m < 60 ? `${m}<small> min</small>` : esc(p.heurepassage.slice(11, 16));
  const clock = esc(p.heurepassage.slice(11, 16));
  return `<div class="t ${p.type === "E" ? "live" : "theo"}"><b>${big}</b><span>${m < 60 ? clock : "&nbsp;"}</span></div>`;
}

function renderTabs() {
  const used = new Set(favs.map(f => f.section));
  const tabs = SECTIONS.filter(s => used.has(s.id));
  if (!tabs.some(t => t.id === currentTab) && tabs.length) currentTab = tabs[0].id;
  $("tabs").classList.toggle("hidden", tabs.length < 2);
  $("tabs").innerHTML = tabs.map(t =>
    `<button class="tab ${t.id === currentTab ? "on" : ""}" style="--c:${t.color}" data-tab="${t.id}">${t.id}</button>`).join("");
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  currentTab = b.dataset.tab;
  renderTabs(); drawBoard();
});

// Dernières données reçues, redessinées toutes les 5 s pour que les minutes et « il y a X s » restent justes entre deux appels
let lastResults = null, lastFetch = 0, loading = false;

function drawBoard() {
  const board = $("board");
  if (!creds.user || !creds.pass) {
    board.innerHTML = `<div class="card empty">Ajoute ton compte data.grandlyon.com dans les réglages.</div>`;
    return;
  }
  if (!favs.length) {
    board.innerHTML = `<div class="card empty">Aucun arrêt. Ajoute-en dans les réglages.</div>`;
    return;
  }
  if (!lastResults) { board.innerHTML = ""; return; }
  const color = sectionColor(currentTab);
  let step = 0;
  board.innerHTML = favs.map((f, i) => {
    if (f.section !== currentTab) return "";
    step++;
    const r = lastResults[i];
    let body;
    if (!r) body = `<div class="empty">Chargement…</div>`;
    else if (r.e) body = `<div class="err">${esc(r.e.message)}</div>`;
    else {
      let list = r.v.filter(p => minutesUntil(p.heurepassage) > -1);
      if (f.choix?.length) list = list.filter(p => f.choix.includes(p.ligne));
      const groups = {};
      for (const p of list) (groups[`${p.ligne}|${p.direction}`] ||= []).push(p);
      const rows = Object.entries(groups)
        .map(([k, ps]) => {
          ps.sort((a, b) => a.heurepassage.localeCompare(b.heurepassage));
          const [ligne, direction] = k.split("|");
          return { ligne, direction, ps: ps.slice(0, MAX_PASSAGES) };
        })
        // Le bus qui arrive le plus tôt en premier
        .sort((a, b) => a.ps[0].heurepassage.localeCompare(b.ps[0].heurepassage));
      body = rows.length
        ? rows.map(g => `<div class="row"><span class="badge">${esc(g.ligne)}</span><span class="dir">→ ${esc(g.direction)}</span><span class="times">${g.ps.map(fmtTime).join("")}</span></div>`).join("")
        : `<div class="empty">Aucun passage prévu</div>`;
    }
    const [from, to] = f.nom.split(" → ");
    return `<div class="card leg" style="--c:${color}">
      <div class="leg-head"><span class="step">${step}</span>
        <div><div class="leg-title">${esc(from)}</div>${to ? `<div class="leg-to">vers ${esc(to)}</div>` : ""}</div>
      </div>${body}</div>`;
  }).join("");
}

function drawStatus() {
  if (!lastFetch) return;
  const s = Math.round((Date.now() - lastFetch) / 1000);
  const ago = s < 5 ? "à l'instant" : s < 60 ? `il y a ${s} s` : `il y a ${Math.floor(s / 60)} min`;
  $("updated").textContent = loading ? "Actualisation…" : `Actualisé ${ago}`;
  $("dot").classList.toggle("stale", s > 90);
}

async function refresh() {
  if (loading || !creds.user || !creds.pass || !favs.length) { drawBoard(); return; }
  loading = true;
  drawStatus();
  lastResults = await Promise.all(favs.map(f =>
    Promise.all(f.ids.map(fetchPassages)).then(vs => ({ v: vs.flat() }), e => ({ e }))));
  lastFetch = Date.now();
  loading = false;
  drawBoard(); drawStatus();
}

let timer = null, tick = null;
function startAuto() {
  clearInterval(timer); clearInterval(tick);
  renderTabs();
  lastResults = null; drawBoard();
  refresh();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  tick = setInterval(() => { if (!document.hidden) { drawBoard(); drawStatus(); } }, 5000);
}
function stopAuto() { clearInterval(timer); clearInterval(tick); }
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("main").classList.contains("hidden")) refresh();
});

// ---------- Réglages ----------
function renderFavs() {
  $("favList").innerHTML = favs.length ? favs.map((f, i) => `
    <div class="fav">
      <div class="fav-head">
        <strong>${esc(f.nom)}</strong>
        <span style="display:flex;gap:6px;flex:none">
          <button data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Monter">↑</button>
          <button data-del="${i}" aria-label="Supprimer">✕</button>
        </span>
      </div>
      <div class="chips">${SECTIONS.map(s => `<button class="chip sec ${f.section === s.id ? "on" : ""}" style="--c:${s.color}" data-fav="${i}" data-sec="${s.id}">${s.id}</button>`).join("")}</div>
      <div class="sub">Lignes affichées (aucune sélection = toutes) :</div>
      <div class="chips">${f.lignes.map(l => `<button class="chip ${f.choix.includes(l) ? "on" : ""}" data-fav="${i}" data-ligne="${esc(l)}">${esc(l)}</button>`).join("")}</div>
    </div>`).join("") : `<div class="empty">Aucun arrêt pour l'instant.</div>`;
}

$("favList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del) favs.splice(+b.dataset.del, 1);
  else if (b.dataset.up) { const i = +b.dataset.up; [favs[i - 1], favs[i]] = [favs[i], favs[i - 1]]; }
  else if (b.dataset.sec) favs[+b.dataset.fav].section = b.dataset.sec;
  else if (b.dataset.ligne) {
    const f = favs[+b.dataset.fav], l = b.dataset.ligne;
    f.choix = f.choix.includes(l) ? f.choix.filter(x => x !== l) : [...f.choix, l];
  }
  save("tcl_favs_v2", favs); renderFavs();
});

let searchSeq = 0;
$("search").addEventListener("input", async e => {
  const q = e.target.value.trim().toLowerCase();
  const seq = ++searchSeq;
  if (q.length < 3) { $("results").textContent = "Tape au moins 3 lettres."; return; }
  $("results").textContent = "Recherche…";
  try {
    const stops = await getStops();
    if (seq !== searchSeq) return;
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const nq = norm(q);
    const hits = stops.filter(s => norm(s.nom).includes(nq)).slice(0, 25);
    $("results").innerHTML = hits.length ? hits.map(s => `
      <div class="result">
        <span><strong>${esc(s.nom)}</strong><span class="sub">${esc(s.commune)} · ${esc(s.lignes.join(", "))}</span></span>
        <button data-add="${esc(s.key)}">${favs.some(f => f.key === s.key) ? "✓" : "Ajouter"}</button>
      </div>`).join("") : "Aucun arrêt trouvé.";
  } catch (err) {
    $("results").textContent = "Impossible de charger la liste des arrêts.";
  }
});

$("results").addEventListener("click", e => {
  const b = e.target.closest("button[data-add]"); if (!b) return;
  const s = allStops.find(x => x.key === b.dataset.add);
  if (!s || favs.some(f => f.key === s.key)) return;
  favs.push({ section: currentTab, key: s.key, ids: s.ids, nom: s.nom, lignes: s.lignes, choix: [] });
  save("tcl_favs_v2", favs); renderFavs(); b.textContent = "✓";
});

$("testBtn").addEventListener("click", async () => {
  creds = { user: $("user").value.trim(), pass: $("pass").value };
  save("tcl_creds", creds);
  $("testResult").textContent = " Test…";
  try {
    await fetchPassages(favs[0]?.ids[0] ?? 10006);
    $("testResult").textContent = " ✓ Connexion OK";
  } catch (err) {
    $("testResult").textContent = " ✕ " + err.message;
  }
});

function openSettings() {
  stopAuto();
  $("user").value = creds.user; $("pass").value = creds.pass;
  renderFavs();
  $("main").classList.add("hidden"); $("settings").classList.remove("hidden");
  window.scrollTo(0, 0);
}
function closeSettings() {
  creds = { user: $("user").value.trim(), pass: $("pass").value };
  save("tcl_creds", creds);
  $("settings").classList.add("hidden"); $("main").classList.remove("hidden");
  window.scrollTo(0, 0);
  startAuto();
}
$("settingsBtn").addEventListener("click", openSettings);
$("doneBtn").addEventListener("click", closeSettings);

// Horloge façon réveil à LED
function drawClock() {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  $("clock").innerHTML = `${pad(d.getHours())}<span class="colon">:</span>${pad(d.getMinutes())}`;
}
drawClock();
setInterval(drawClock, 1000);

if (!creds.user || !favs.length) openSettings(); else startAuto();
</script>
</body>
</html>
