<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mes bus">
<meta name="theme-color" content="#16120e">
<link rel="apple-touch-icon" href="icon.png">
<title>Mes bus TCL</title>
<style>
  :root {
    --bg: #16120e; --card: #221b15; --card2: #2b231b; --line: #362b21; --text: #f6ede2;
    --muted: #a8977f; --accent: #e2001a; --ok: #9ad48a; --warn: #ff7a59;
    --aller: #f2a33a; --retour: #e5684a; --autre: #c49a6c;
    --top: env(safe-area-inset-top, 0px);
    --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 var(--font); }
  body { padding: 0 16px calc(env(safe-area-inset-bottom) + 28px); min-height: 100vh;
    background: radial-gradient(110% 50% at 50% -5%, rgba(242, 163, 58, .10), transparent 60%), var(--bg); background-attachment: fixed; }

  /* Barre du haut opaque : elle recouvre la zone du notch pour que rien ne passe dessous en flou */
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg);
    margin: 0 -16px; padding: calc(var(--top) + 16px) 16px 10px; }
  .topbar-row { display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.02em; flex: 1; }
  .clock { font-size: 22px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; }

  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; cursor: pointer; }
  button.primary { background: var(--aller); border-color: var(--aller); color: #1d140a; font-weight: 700; }
  .round { width: 46px; height: 46px; border-radius: 50%; padding: 0; display: grid; place-items: center; flex: none; }
  .round svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Onglets Aller / Retour */
  .tabs { display: flex; gap: 6px; background: var(--card); border-radius: 16px; padding: 4px; margin-top: 14px; }
  .tab { flex: 1; border: 0; border-radius: 12px; padding: 11px 0; background: transparent; font-weight: 700;
    color: var(--muted); font-size: 17px; }
  .tab.on { color: #1d140a; background: var(--c); }
  .status { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 8px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.stale { background: var(--warn); }

  input { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card2); color: var(--text); margin: 6px 0 12px; }

  /* Carte d'étape */
  .card { background: var(--card); border-radius: 20px; padding: 14px 16px; margin-bottom: 12px; }
  .leg { border-top: 3px solid var(--c); }
  .leg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .step { color: var(--c); font-weight: 800; font-size: 15px; flex: none; }
  .leg-title { font-weight: 700; font-size: 16px; line-height: 1.25; }
  .leg-title span { color: var(--muted); font-weight: 500; }
  .badge { min-width: 46px; text-align: center; font-weight: 800; font-size: 15px; padding: 5px 7px;
    border-radius: 9px; background: var(--accent); color: #fff; flex: none; }

  /* Prochain départ en grand : ligne, compte à rebours, heure de passage */
  .hero { display: flex; align-items: center; gap: 12px; }
  .big { font-size: 46px; font-weight: 800; line-height: .95; letter-spacing: -.03em; color: var(--ok); font-variant-numeric: tabular-nums; }
  .big small { font-size: 17px; font-weight: 600; letter-spacing: 0; margin-left: 3px; opacity: .8; }
  .at { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); line-height: 1.2; }
  .at b { display: block; font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; }
  .hero.urgent .big, .hero.urgent .at em { color: var(--warn); }
  .at em { font-style: normal; font-weight: 700; }

  /* Jauge : se remplit à mesure que le bus approche (sur 20 min) */
  .meter { height: 5px; border-radius: 5px; background: var(--line); margin: 12px 0; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 5px; background: var(--ok); transition: width .6s; }
  .hero.urgent + .meter i { background: var(--warn); }

  /* Départs suivants, toutes lignes confondues, dans l'ordre */
  .next { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nx { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px; background: var(--card2); }
  .nx .badge { font-size: 11px; min-width: 34px; padding: 2px 5px; border-radius: 6px; }
  .nx b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .nx b small { font-size: 12px; font-weight: 600; color: var(--muted); }
  .nx span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .err { color: var(--warn); font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
  .legend { margin-top: 4px; text-align: center; }

  /* Réglages */
  .card h2 { font-size: 17px; margin: 0 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  .chip { font-size: 14px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.sec.on { background: var(--c); border-color: var(--c); color: #1d140a; }
  .result { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .result .sub { display: block; }
  .fav { padding: 12px 0; border-top: 1px solid var(--line); }
  .fav:first-child { border-top: 0; }
  .fav-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ===== Écran principal ===== -->
<section id="main">
  <div class="topbar">
    <div class="topbar-row">
      <h1>Mes bus</h1>
      <span class="clock" id="clock">--:--</span>
      <button class="round" id="settingsBtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="status sub"><span class="dot" id="dot"></span><span id="updated">Chargement…</span></div>
  </div>
  <div id="board"></div>
  <p class="sub legend">Temps réel uniquement · actualisation auto toutes les 15 s</p>
</section>

<!-- ===== Réglages ===== -->
<section id="settings" class="hidden">
  <div class="topbar">
    <div class="topbar-row">
      <h1>Réglages</h1>
      <button class="primary" id="doneBtn">Terminé</button>
    </div>
  </div>

  <div class="card">
    <h2>Compte data.grandlyon.com</h2>
    <div class="sub">Mot de passe de la plateforme de données (API). Stocké uniquement sur cet appareil.</div>
    <input id="user" placeholder="Identifiant (e-mail)" autocomplete="username" autocapitalize="off">
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button id="testBtn">Tester la connexion</button>
    <span id="testResult" class="sub"></span>
  </div>

  <div class="card">
    <h2>Mes arrêts</h2>
    <div id="favList"></div>
  </div>

  <div class="card">
    <h2>Ajouter un arrêt</h2>
    <input id="search" placeholder="Nom de l'arrêt (ex. Bellecour)" autocomplete="off">
    <div id="results" class="sub">Tape au moins 3 lettres.</div>
  </div>
</section>

<script>
const API = "https://download.data.grandlyon.com/ws/rdata";
const REFRESH_MS = 15000;
const NEXT_COUNT = 3;   // départs affichés après le prochain
const URGENT_MIN = 3;   // en dessous : compte à rebours en orange
const SECTIONS = [
  { id: "Aller", color: "var(--aller)" },
  { id: "Retour", color: "var(--retour)" },
  { id: "Autre", color: "var(--autre)" },
];
const sectionColor = id => (SECTIONS.find(s => s.id === id) || SECTIONS[2]).color;

// ---------- Stockage local ----------
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}
let creds = load("tcl_creds", { user: "", pass: "" });
// favoris : [{ section, key, ids: [...quais], nom, lignes: [...toutes les lignes], choix: [...lignes affichées, vide = toutes] }]
// Trajets par défaut. Chaque arrêt ne garde que les quais du bon sens (ids), donc on ne voit pas la direction opposée.
const DEFAULT_FAVS = [
  { section: "Aller", key: "aller-1", nom: "Instit. Art Contemporain → Part-Dieu", ids: [47001], lignes: ["TB11", "C23"], choix: ["TB11", "C23"] },
  { section: "Aller", key: "aller-2", nom: "Part-Dieu Jules Favre → Echangeur du Pérollier", ids: [2206], lignes: ["C6"], choix: ["C6"] },
  { section: "Retour", key: "retour-1", nom: "Echangeur du Pérollier → Part-Dieu", ids: [47985], lignes: ["C6"], choix: ["C6"] },
  { section: "Retour", key: "retour-2", nom: "Part-Dieu Jules Favre → Instit. Art Contemporain", ids: [46191], lignes: ["TB11", "C23"], choix: ["TB11", "C23"] },
];
let favs = load("tcl_favs_v2", DEFAULT_FAVS);
favs.forEach(f => { f.section ||= "Autre"; });

// Onglet affiché : Aller avant midi, Retour à partir de 12 h
let currentTab = new Date().getHours() < 12 ? "Aller" : "Retour";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- API ----------
async function fetchPassages(stopId) {
  const url = `${API}/tcl_sytral.tclpassagearret/all.json?maxfeatures=-1&field=id&value=${encodeURIComponent(stopId)}`;
  let res;
  try {
    res = await fetch(url, {
      headers: { Authorization: "Basic " + btoa(unescape(encodeURIComponent(`${creds.user}:${creds.pass}`))) },
    });
  } catch {
    // Le serveur renvoie ses 401 sans en-tête CORS : le navigateur ne voit qu'une erreur réseau
    throw new Error("Connexion impossible : identifiants incorrects, accès au jeu de données non validé, ou pas de réseau");
  }
  if (res.status === 401 || res.status === 403) throw new Error("Identifiants refusés ou accès au jeu de données non validé");
  if (!res.ok) throw new Error(`Erreur ${res.status}`);
  return (await res.json()).values || [];
}

let allStops = null;
async function getStops() {
  if (allStops) return allStops;
  const res = await fetch(`${API}/tcl_sytral.tclarret/all.json?maxfeatures=-1`);
  const json = await res.json();
  // Regroupe les quais portant le même nom dans la même commune
  const byKey = new Map();
  for (const s of json.values) {
    const key = `${s.nom}|${s.commune || ""}`;
    if (!byKey.has(key)) byKey.set(key, { key, nom: s.nom, commune: s.commune || "", ids: [], lignes: new Set() });
    const g = byKey.get(key);
    g.ids.push(s.id);
    (s.desserte || "").split(",").map(d => d.split(":")[0]).filter(Boolean).forEach(l => g.lignes.add(l));
  }
  allStops = [...byKey.values()].map(g => ({
    ...g, lignes: [...g.lignes].sort((a, b) => a.localeCompare(b, "fr", { numeric: true })),
  }));
  return allStops;
}

// ---------- Affichage des passages ----------
const toDate = ts => new Date(ts.replace(" ", "T"));
const minutesUntil = ts => Math.round((toDate(ts) - Date.now()) / 60000);
const clockOf = ts => esc(ts.slice(11, 16));

function renderTabs() {
  const used = new Set(favs.map(f => f.section));
  const tabs = SECTIONS.filter(s => used.has(s.id));
  if (!tabs.some(t => t.id === currentTab) && tabs.length) currentTab = tabs[0].id;
  $("tabs").classList.toggle("hidden", tabs.length < 2);
  $("tabs").innerHTML = tabs.map(t =>
    `<button class="tab ${t.id === currentTab ? "on" : ""}" style="--c:${t.color}" data-tab="${t.id}">${t.id}</button>`).join("");
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  currentTab = b.dataset.tab;
  renderTabs(); drawBoard();
});

// Prochain bus en grand, puis les suivants toutes lignes confondues (ils vont au même endroit)
function legBody(f, r) {
  if (!r) return `<div class="empty">Chargement…</div>`;
  if (r.e) return `<div class="err">${esc(r.e.message)}</div>`;
  // Seulement les passages suivis en temps réel (type "E"), pas les horaires théoriques
  const deps = r.v
    .filter(p => p.type === "E" && minutesUntil(p.heurepassage) > -1)
    .filter(p => !f.choix?.length || f.choix.includes(p.ligne))
    .sort((a, b) => a.heurepassage.localeCompare(b.heurepassage));
  if (!deps.length) return `<div class="empty">Aucun bus en approche pour l'instant</div>`;

  const [first, ...rest] = deps;
  const m = minutesUntil(first.heurepassage);
  const urgent = m <= URGENT_MIN;
  const fill = Math.max(6, Math.min(100, 100 - m * 5));
  const big = m <= 0 ? "Proche" : `${m}<small>min</small>`;
  return `
    <div class="hero ${urgent ? "urgent" : ""}">
      <span class="badge">${esc(first.ligne)}</span>
      <span class="big">${big}</span>
      <span class="at">${urgent ? "<em>Dépêche-toi</em>" : "passage"}<b>${clockOf(first.heurepassage)}</b></span>
    </div>
    <div class="meter"><i style="width:${fill}%"></i></div>
    ${rest.length ? `<div class="next">${rest.slice(0, NEXT_COUNT).map(p => `
      <div class="nx"><span class="badge">${esc(p.ligne)}</span><b>${Math.max(0, minutesUntil(p.heurepassage))}<small> min</small></b><span>${clockOf(p.heurepassage)}</span></div>`).join("")}
    </div>` : ""}`;
}

// Dernières données reçues, redessinées toutes les 5 s pour que les minutes restent justes entre deux appels
let lastResults = null, lastFetch = 0, loading = false;

function drawBoard() {
  const board = $("board");
  if (!creds.user || !creds.pass) {
    board.innerHTML = `<div class="card empty">Ajoute ton compte data.grandlyon.com dans les réglages.</div>`;
    return;
  }
  if (!favs.length) {
    board.innerHTML = `<div class="card empty">Aucun arrêt. Ajoute-en dans les réglages.</div>`;
    return;
  }
  const color = sectionColor(currentTab);
  let step = 0;
  board.innerHTML = favs.map((f, i) => {
    if (f.section !== currentTab) return "";
    step++;
    const [from, to] = f.nom.split(" → ");
    return `<div class="card leg" style="--c:${color}">
      <div class="leg-head"><span class="step">${step}</span>
        <div class="leg-title">${esc(from)}${to ? ` <span>→ ${esc(to)}</span>` : ""}</div>
      </div>${legBody(f, lastResults?.[i])}</div>`;
  }).join("");
}

function drawStatus() {
  if (!lastFetch) return;
  const s = Math.round((Date.now() - lastFetch) / 1000);
  const ago = s < 5 ? "à l'instant" : s < 60 ? `il y a ${s} s` : `il y a ${Math.floor(s / 60)} min`;
  $("updated").textContent = loading ? "Actualisation…" : `Actualisé ${ago}`;
  $("dot").classList.toggle("stale", s > 60);
}

async function refresh() {
  if (loading || !creds.user || !creds.pass || !favs.length) { drawBoard(); return; }
  loading = true;
  drawStatus();
  lastResults = await Promise.all(favs.map(f =>
    Promise.all(f.ids.map(fetchPassages)).then(vs => ({ v: vs.flat() }), e => ({ e }))));
  lastFetch = Date.now();
  loading = false;
  drawBoard(); drawStatus();
}

let timer = null, tick = null;
function startAuto() {
  clearInterval(timer); clearInterval(tick);
  renderTabs();
  lastResults = null; drawBoard();
  refresh();
  timer = setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
  tick = setInterval(() => { if (!document.hidden) { drawBoard(); drawStatus(); } }, 5000);
}
function stopAuto() { clearInterval(timer); clearInterval(tick); }
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !$("main").classList.contains("hidden")) refresh();
});

// ---------- Réglages ----------
function renderFavs() {
  $("favList").innerHTML = favs.length ? favs.map((f, i) => `
    <div class="fav">
      <div class="fav-head">
        <strong>${esc(f.nom)}</strong>
        <span style="display:flex;gap:6px;flex:none">
          <button data-up="${i}" ${i === 0 ? "disabled" : ""} aria-label="Monter">↑</button>
          <button data-del="${i}" aria-label="Supprimer">✕</button>
        </span>
      </div>
      <div class="chips">${SECTIONS.map(s => `<button class="chip sec ${f.section === s.id ? "on" : ""}" style="--c:${s.color}" data-fav="${i}" data-sec="${s.id}">${s.id}</button>`).join("")}</div>
      <div class="sub">Lignes affichées (aucune sélection = toutes) :</div>
      <div class="chips">${f.lignes.map(l => `<button class="chip ${f.choix.includes(l) ? "on" : ""}" data-fav="${i}" data-ligne="${esc(l)}">${esc(l)}</button>`).join("")}</div>
    </div>`).join("") : `<div class="empty">Aucun arrêt pour l'instant.</div>`;
}

$("favList").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.del) favs.splice(+b.dataset.del, 1);
  else if (b.dataset.up) { const i = +b.dataset.up; [favs[i - 1], favs[i]] = [favs[i], favs[i - 1]]; }
  else if (b.dataset.sec) favs[+b.dataset.fav].section = b.dataset.sec;
  else if (b.dataset.ligne) {
    const f = favs[+b.dataset.fav], l = b.dataset.ligne;
    f.choix = f.choix.includes(l) ? f.choix.filter(x => x !== l) : [...f.choix, l];
  }
  save("tcl_favs_v2", favs); renderFavs();
});

let searchSeq = 0;
$("search").addEventListener("input", async e => {
  const q = e.target.value.trim().toLowerCase();
  const seq = ++searchSeq;
  if (q.length < 3) { $("results").textContent = "Tape au moins 3 lettres."; return; }
  $("results").textContent = "Recherche…";
  try {
    const stops = await getStops();
    if (seq !== searchSeq) return;
    const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
    const nq = norm(q);
    const hits = stops.filter(s => norm(s.nom).includes(nq)).slice(0, 25);
    $("results").innerHTML = hits.length ? hits.map(s => `
      <div class="result">
        <span><strong>${esc(s.nom)}</strong><span class="sub">${esc(s.commune)} · ${esc(s.lignes.join(", "))}</span></span>
        <button data-add="${esc(s.key)}">${favs.some(f => f.key === s.key) ? "✓" : "Ajouter"}</button>
      </div>`).join("") : "Aucun arrêt trouvé.";
  } catch (err) {
    $("results").textContent = "Impossible de charger la liste des arrêts.";
  }
});

$("results").addEventListener("click", e => {
  const b = e.target.closest("button[data-add]"); if (!b) return;
  const s = allStops.find(x => x.key === b.dataset.add);
  if (!s || favs.some(f => f.key === s.key)) return;
  favs.push({ section: currentTab, key: s.key, ids: s.ids, nom: s.nom, lignes: s.lignes, choix: [] });
  save("tcl_favs_v2", favs); renderFavs(); b.textContent = "✓";
});

$("testBtn").addEventListener("click", async () => {
  creds = { user: $("user").value.trim(), pass: $("pass").value };
  save("tcl_creds", creds);
  $("testResult").textContent = " Test…";
  try {
    await fetchPassages(favs[0]?.ids[0] ?? 10006);
    $("testResult").textContent = " ✓ Connexion OK";
  } catch (err) {
    $("testResult").textContent = " ✕ " + err.message;
  }
});

function openSettings() {
  stopAuto();
  $("user").value = creds.user; $("pass").value = creds.pass;
  renderFavs();
  $("main").classList.add("hidden"); $("settings").classList.remove("hidden");
  window.scrollTo(0, 0);
}
function closeSettings() {
  creds = { user: $("user").value.trim(), pass: $("pass").value };
  save("tcl_creds", creds);
  $("settings").classList.add("hidden"); $("main").classList.remove("hidden");
  window.scrollTo(0, 0);
  startAuto();
}
$("settingsBtn").addEventListener("click", openSettings);
$("doneBtn").addEventListener("click", closeSettings);

function drawClock() {
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  $("clock").textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
drawClock();
setInterval(drawClock, 5000);

if (!creds.user || !favs.length) openSettings(); else startAuto();
</script>
</body>
</html>
